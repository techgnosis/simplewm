# xdg-desktop-portal backend selection for XDG_CURRENT_DESKTOP=simplewm.
# Install to ~/.config/xdg-desktop-portal/ (`make install-portal` does this).
#
# File dialogs are drawn by simplewm itself. Everything else is turned off, so no
# other portal backend gets started; change `default=none` to e.g. `default=gtk` to
# keep the other portals (settings, app chooser, printing, ...).
[preferred]
default=none
org.freedesktop.impl.portal.FileChooser=simplewm
