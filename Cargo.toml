[package]
name = "simplewm"
version = "0.1.0"
edition = "2024"
# 1.100 is the first Cargo that honors .cargo/config.toml's min-publish-age.
rust-version = "1.100"

[dependencies]
smithay = { version = "0.7.0", default-features = false, features = [
    "backend_winit",
    "backend_drm",
    "backend_gbm",
    "backend_egl",
    "backend_libinput",
    "backend_udev",
    "backend_session_libseat",
    "renderer_gl",
    "desktop",
    "wayland_frontend",
] }
fontdue = "0.9.5"
tracing = "0.1"
tracing-subscriber = "0.3"
png = "0.18"
futures-channel = "0.3.34"
zbus = { version = "6", features = ["bus-impl"] }
libc = "0.2"
serde_json = "1.0.154"
